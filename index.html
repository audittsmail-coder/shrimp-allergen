<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลตรวจเชื้อรายบ่อ — อนันต์ฟาร์ม</title>
<meta name="theme-color" content="#0f5c5c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ผลเชื้อรายบ่อ">
<!-- ?v= is bumped on every deploy to force iOS "Add to Home Screen" (and any browser)
     to fetch the new file instead of serving a stale cached copy -->
<link rel="stylesheet" href="style.css?v=4">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="eyebrow">ระบบติดตามผลตรวจเชื้อ</div>
    <h1>ผลตรวจเชื้อรายบ่อ</h1>
    <div class="meta" id="connStatus">
      <div>สถานะ Firebase: <b id="fbStatusText">ยังไม่ได้ตั้งค่า</b></div>
    </div>
  </header>

  <!-- HOME: pond grid grouped by farm -->
  <main id="view-home" class="view">
    <div class="section">
      <div id="homeStatus" class="status-txt"></div>
      <div id="farmGroups"></div>
    </div>
  </main>

  <!-- DETAIL: full pathogen history for one pond -->
  <main id="view-detail" class="view" style="display:none;">
    <div class="section">
      <button id="backBtn" class="btn-secondary small" style="margin-top:0;">← กลับ</button>
      <div id="detailHeader"></div>
      <div id="detailStatus" class="status-txt"></div>
      <div id="detailHistory"></div>
      <div id="detailCharts" class="chart-grid"></div>
      <div class="action-row">
        <button id="clearPondBtn" class="btn-secondary small" style="color:var(--coral); border-color:var(--coral);">🗑️ ลบผลเชื้อทั้งหมดของบ่อนี้</button>
      </div>
    </div>
  </main>

  <div class="bottom-space"></div>
</div>

<script type="module" src="app.js?v=4"></script>
</body>
</html>
